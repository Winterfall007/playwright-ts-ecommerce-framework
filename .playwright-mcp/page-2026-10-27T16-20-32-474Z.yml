                - generic [ref=e153]: Embrace your gray without stopping coloring altogether.
              - paragraph [ref=e154]:
                - generic [ref=e155]: Grey Blending is a coloring technique that mixes or blends gray with your own hair color. You don't completely hide your gray hairs, but you get a softer effect because fewer gray hairs are visible.
              - paragraph [ref=e156]:
                - generic [ref=e157]: You get less harsh regrowth because we don't color over all your gray. As a result, you also need to color less often.
          - generic [ref=e159]:
            - generic [ref=e160]:
              - paragraph [ref=e161]:
                - generic [ref=e162]: A Grey Blending almost always begins with a major transformation treatment. During this color session, I often use multiple techniques such as highlights, lowlights, and a toner.
              - paragraph [ref=e163]:
                - generic [ref=e164]: You will see a big difference after this coloring session, such as a softer color transition from your gray to the still-colored ends and a cooler shade instead of a lot of warmth.
              - paragraph [ref=e165]:
                - generic [ref=e166]: After this transformation, your own gray will already look softer. Follow-up appointments will yield an increasingly natural result.
              - paragraph [ref=e167]:
                - generic [ref=e168]: And after a while, you keep your color looking beautiful with a Grey Refresh. This way, you retain your shine, and we refresh your color and hair.
