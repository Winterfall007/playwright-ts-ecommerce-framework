                      - generic: "LET'S TALK GRAY BLENDING! My favorite technique for softening gray hair without fully covering all the gray. This will prevent a harsh re-growth line. >> swipe for before We decided not to go lighter yet so this color was an all over demi-permanent color close to her natural tone. This will give a soft blend of color on the gray hair and grow out will also be very soft as it slowly fades over time. Perfect for fewer touch-ups. Color formulation Innersense Color Purity: on dry, unwashed hair: 30 gr 5G + 10 gr 6N + 5 gr GG + 90 gr 5 vol 25 min Are you a hairdresser wanting to learn more about Gray Blending with Color Purity? Get in touch via DM or email."
