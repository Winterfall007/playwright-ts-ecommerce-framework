                      - generic: "BEAUTIFUL GRAY BLENDING >swipe for vid I absolutely love blending gray with Innersense Color Purity! It gives a beautiful glow to the gray and seamlessly blends with the natural strands that are left. I used my specialty technique which is an all over color that I then blend into the mid-sections as a reverse balayage. I leave out the ends for a natural looking fade. After rinsing the color I used the repair mask to care for the ends. Formula: On dry hair: 30 gr 9N + 7 gr 9V + 3 gr clear 5 vol 1:2 20 min"
