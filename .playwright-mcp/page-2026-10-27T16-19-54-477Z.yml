                      - generic: "GRAY BLENDED BRONDE. This was my lovely clients first time in my salon. She wanted a softer color (after years of coloring herself) but wasn't ready to be cool toned blond / gray. Eventually we will go a little lighter but I chose to do a soft lift as her ends were quite fragile. Gray Blending is a process and comes in many different tones. Formula: Teased foilyage Pure Lightener 10 vol Lowlights in between 8N + 9V + 2 gr VV 5 vol After washing root shadow to blend gray 7N + 8V 5 vol Toner ends 9N + 9V + clear 5 vol Styled after a dry curl cut with Air Dry Styling Cream, I Create Curl Memory Finished with Overnight Repair Serum."
