                      - generic: "COLOR GLOSS. My beautiful client came in with a color done elsewhere that had grown out warm highlights and too warm lowlights. She wants to embrace her natural color for now but also liked some dimension left in her hair. I put a soft gray blend gloss on her roots and a color gloss on her ends to tone down the warmth while keeping it slightly lighter. Formulation: Innersense Color Purity demi permanent Roots: 35gr 6N + 10gr 6G + 5gr 8v + 5 vol 1:2 Ends: 15 gr 8N + 5gr 8V + 15 gr clear + 5 vol 1:2 On towel dry hair 20 min process time"
