              - heading "My name is Eva Maria Cornelia" [level=4] [ref=e142]:
                - generic [ref=e143]: My name is Eva Maria Cornelia
              - paragraph [ref=e144]:
                - generic [ref=e145]: I am the founder and owner of Cornelia Organics, an Organic and Holistic Curl salon studio in the heart of Utrecht. Here, I give you and your curls my undivided attention, and every treatment is custom-made.
              - paragraph [ref=e146]:
                - generic [ref=e147]: I specialize in cutting curly and wavy hair, Grey Blending, and my Signature Curly Highlights / Foilyage. I use organic care and styling products as much as possible. For coloring, I use the clean, low-toxin color from Innersense and apply techniques that expose you to as few chemicals as possible.
              - paragraph [ref=e148]:
                - generic [ref=e149]: In addition to my work in the salon, I am also a trainer for Innersense. I have a great passion for educating other hairdressers. I also provide private training to hairdressers in my studio. So, if you are a hairdresser looking for training, be sure to check out the offerings.
              - paragraph [ref=e150]:
                - generic [ref=e151]: The name of the salon is a tribute to my grandmother Cornelia. She met my grandfather (Cornelis) during a visit to the hairdresser's salon. My grandparents worked together in that salon for many years until my parents (both hairdressers as well) took over and continued running the salon.
