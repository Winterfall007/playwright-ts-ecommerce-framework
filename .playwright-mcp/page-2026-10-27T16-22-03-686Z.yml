        - heading "Privacybeleid" [level=1] [ref=e122]
        - generic [ref=e123]:
          - heading "Privacybeleid" [level=2] [ref=e124]
          - generic [ref=e125]:
            - heading "Wie we zijn" [level=3] [ref=e126]
            - paragraph [ref=e127]:
              - text: "Het adres van onze website is:"
              - link "https://corneliaorganics.com" [ref=e128] [cursor=pointer]:
                - /url: https://www.corneliaorganics.com
              - text: .
          - generic [ref=e129]:
            - heading "Reacties" [level=4] [ref=e130]
            - paragraph [ref=e131]: Wanneer bezoekers reacties achterlaten op de site, verzamelen we de gegevens die worden weergegeven in het reactieformulier, evenals het IP-adres van de bezoeker en de browser user agent string om spamdetectie te helpen.
            - paragraph [ref=e132]:
              - text: "Een geanonimiseerde tekstreeks, gemaakt op basis van uw e-mailadres (ook wel een hash genoemd), kan worden verstrekt aan de Gravatar-service om te controleren of u deze gebruikt. Het privacybeleid van de Gravatar-service is hier te vinden:"
              - link "automattic.com/privacy" [ref=e133] [cursor=pointer]:
                - /url: https://automattic.com/privacy/
              - text: . Nadat uw reactie is goedgekeurd, is uw profielfoto zichtbaar voor het publiek in de context van uw reactie.
          - generic [ref=e134]:
            - heading "Media" [level=4] [ref=e135]
            - paragraph [ref=e136]:
              - text: Als u afbeeldingen naar de website uploadt, moet u voorkomen dat u afbeeldingen uploadt met ingesloten locatiegegevens (
              - code [ref=e137]: EXIF GPS
              - text: ). Bezoekers van de website kunnen locatiegegevens uit afbeeldingen op de website downloaden en extraheren.
          - generic [ref=e138]:
            - heading "Cookies" [level=4] [ref=e139]
            - paragraph [ref=e140]: Als u een reactie achterlaat op onze site, kunt u ervoor kiezen om uw naam, e-mailadres en website in cookies op te slaan. Dit is voor uw gemak, zodat u deze gegevens niet opnieuw hoeft in te vullen bij een nieuwe reactie. Deze cookies zijn een jaar geldig.
            - paragraph [ref=e141]: Als u onze inlogpagina bezoekt, plaatsen we een tijdelijke cookie om te bepalen of uw browser cookies accepteert. Deze cookie bevat geen persoonlijke gegevens en wordt verwijderd zodra u uw browser sluit.
            - paragraph [ref=e142]: Wanneer u inlogt, plaatsen we ook enkele cookies om uw inloggegevens en uw schermweergaveopties op te slaan. Inlogcookies blijven twee dagen geldig en cookies voor schermweergaveopties een jaar. Als u “Onthoud mij” selecteert, blijft uw inloggegevens twee weken bewaard. Als u uitlogt, worden de inlogcookies verwijderd.
            - paragraph [ref=e143]: Als u een artikel bewerkt of publiceert, wordt er een extra cookie in uw browser opgeslagen. Deze cookie bevat geen persoonlijke gegevens en geeft alleen de bericht-ID van het artikel dat u zojuist hebt bewerkt weer. Deze cookie verloopt na 1 dag.
          - generic [ref=e144]:
            - heading "Ingesloten content van andere websites" [level=4] [ref=e145]
            - paragraph [ref=e146]: Artikelen op deze site kunnen ingesloten content bevatten (bijv. video’s, afbeeldingen, artikelen, enz.). Ingesloten content van andere websites gedraagt zich precies hetzelfde alsof de bezoeker de andere website heeft bezocht.
            - paragraph [ref=e147]: Deze websites kunnen gegevens over u verzamelen, cookies gebruiken, aanvullende tracking van derden insluiten en uw interactie met die ingesloten content monitoren, inclusief het volgen van uw interactie met de ingesloten content als u een account heeft en bent ingelogd op die website.
          - generic [ref=e148]:
            - heading "Met wie we uw gegevens delen" [level=4] [ref=e149]
            - paragraph [ref=e150]: Wij delen onze gegevens absoluut met niemand. Privacy is voor ons van het grootste belang. Houd er echter rekening mee dat als u een wachtwoordherstel aanvraagt, uw IP-adres wordt opgenomen in de reset-e-mail.
          - generic [ref=e151]:
            - heading "Hoe lang we uw gegevens bewaren" [level=4] [ref=e152]
            - paragraph [ref=e153]: Als u een reactie achterlaat, worden de reactie en de bijbehorende metadata voor onbepaalde tijd bewaard. Dit is zodat we vervolgreacties automatisch kunnen herkennen en goedkeuren in plaats van ze te modereren.
            - paragraph [ref=e154]: Voor gebruikers die zich registreren op onze website (indien van toepassing), bewaren we ook de persoonlijke informatie die ze in hun gebruikersprofiel opgeven. Alle gebruikers kunnen hun persoonlijke informatie op elk moment bekijken, bewerken of verwijderen (behalve dat ze hun gebruikersnaam niet kunnen wijzigen). Websitebeheerders kunnen die informatie ook bekijken en bewerken.
          - generic [ref=e155]:
            - heading "Welke rechten u hebt over uw gegevens" [level=4] [ref=e156]
            - paragraph [ref=e157]: Als u een account op deze site heeft of reacties heeft achtergelaten, kunt u een exportbestand aanvragen van de persoonlijke gegevens die we over u bewaren, inclusief alle gegevens die u ons hebt verstrekt. U kunt ook verzoeken dat we alle persoonlijke gegevens die we over u bewaren, verwijderen. Dit omvat geen gegevens die we verplicht moeten bewaren voor administratieve, wettelijke of beveiligingsdoeleinden.
          - generic [ref=e158]:
            - heading "Waar uw gegevens naartoe worden verzonden" [level=4] [ref=e159]
            - paragraph [ref=e160]: We sturen uw gegevens absoluut niet naar elders, behalve u, wanneer u daarom vraagt. Reacties van bezoekers kunnen worden gecontroleerd via een geautomatiseerde spamdetectieservice.
